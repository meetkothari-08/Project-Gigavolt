[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigavolt"
version = "1.0.0"
description = "Multi-model data platform and hybrid RAG engine for battery field service"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meet Kothari" }]
requires-python = ">=3.10"
keywords = ["rag", "mariadb", "galera", "chromadb", "mongodb", "data-engineering", "lakehouse"]
dependencies = [
    "pymysql>=1.1",
    "pymongo>=4.6",
    "chromadb>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Embedding model, PDF extraction and tokenizer (vector/document server).
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "pymupdf>=1.24",
    "numpy>=1.26",
]
# Notebook analysis.
analysis = ["pandas>=2.0", "matplotlib>=3.8", "jupyter>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "shellcheck-py>=0.10"]

[project.urls]
Repository = "https://github.com/meetkothari-08/Project-Gigavolt"

[project.scripts]
gigavolt-ask = "gigavolt.cli:main"
gigavolt-ingest-relational = "gigavolt.ingestion.relational.sync:main"
gigavolt-ingest-documents = "gigavolt.ingestion.documents.sync:main"

# One `gigavolt` package, with each subpackage kept in the milestone folder
# that introduced it.
[tool.setuptools]
packages = [
    "gigavolt",                        # m5-rag-assistant: config, retry, CLI
    "gigavolt.retrieval",              # m5-rag-assistant
    "gigavolt.rag",                    # m5-rag-assistant
    "gigavolt.chunking",               # m4-semantic-search
    "gigavolt.ingestion",              # m6-ops-evaluation
    "gigavolt.ingestion.relational",   # m6-ops-evaluation
    "gigavolt.ingestion.documents",    # m6-ops-evaluation
    "gigavolt.services",               # m6-ops-evaluation
]

[tool.setuptools.package-dir]
"gigavolt" = "m5-rag-assistant/gigavolt"
"gigavolt.chunking" = "m4-semantic-search/chunking"
"gigavolt.ingestion" = "m6-ops-evaluation/ingestion"
"gigavolt.services" = "m6-ops-evaluation/services"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["m4-semantic-search/scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["m4-semantic-search/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "N", "A"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["gigavolt", "_common"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts are kept close to the code that produced the recorded
# results. Their search() closures are invoked inside the same loop iteration.
"m4-semantic-search/scripts/*.py" = ["E501", "B023", "B007", "BLE001"]
