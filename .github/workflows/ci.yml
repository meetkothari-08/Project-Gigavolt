name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  sql:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MARIADB_HOST: 127.0.0.1
      MARIADB_USER: root
      MARIADB_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Deploy schema, triggers, procedure and views
        run: scripts/deploy_database.sh
      - name: Unit-test the cleansing functions
        run: |
          mariadb -h 127.0.0.1 -uroot -pci-root --batch --skip-column-names \
            < 01-data-ingestion/validation/validate_cleansing_functions.sql > results.tsv
          cat results.tsv
          test "$(grep -c 'PASS$' results.tsv)" -eq 15
      - name: Check that every SQL object exists
        run: |
          mariadb -h 127.0.0.1 -uroot -pci-root gigavolt --batch --skip-column-names -e "
            SELECT IF(
              (SELECT COUNT(*) FROM information_schema.TABLES
                WHERE TABLE_SCHEMA='gigavolt' AND TABLE_TYPE='BASE TABLE') = 20
              AND (SELECT COUNT(*) FROM information_schema.TRIGGERS
                WHERE TRIGGER_SCHEMA='gigavolt') = 4
              AND (SELECT COUNT(*) FROM information_schema.ROUTINES
                WHERE ROUTINE_SCHEMA='gigavolt') = 4
              AND (SELECT COUNT(*) FROM information_schema.VIEWS
                WHERE TABLE_SCHEMA='gigavolt') = 1,
              'ok', 'missing objects')" | tee /dev/stderr | grep -qx ok
