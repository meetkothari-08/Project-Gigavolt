# systemd drop-in for mariadb.service on every Galera node.
# Install as /etc/systemd/system/mariadb.service.d/override.conf, then
#   sudo systemctl daemon-reload
#
# After a Learner Lab shutdown the nodes must NOT race to restart: a node with
# stale data could form a new primary component. Nodes are started by hand
# following GIGAVOLT_RECOVERY.md (bootstrap the most advanced node first).
[Service]
Restart=no
